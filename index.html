<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="QARA — премиальная уличная одежда. Новая коллекция 2026." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Unbounded:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <title>QARA — стиль в деталях</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Показывает ошибку на экране, если приложение не запустилось
      window.addEventListener('error', function (e) {
        var r = document.getElementById('root');
        if (r && !r.childElementCount) {
          r.innerHTML = '<pre style="padding:24px;color:#ff9b9b;white-space:pre-wrap;font-size:12px">Ошибка загрузки: ' +
            String(e.message || (e.target && (e.target.src || e.target.href)) || e.error) + '</pre>';
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
